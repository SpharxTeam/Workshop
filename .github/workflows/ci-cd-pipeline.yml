# ============================================
# GitHub Actions CI/CD Pipeline for Workshop V2.0
# Automated testing, quality checks, and deployment
# ============================================

name: Workshop V2.0 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨3点运行定时任务（健康检查、依赖更新等）
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署目标环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_tests:
        description: '是否运行完整测试套件'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Job 1: Code Quality & Linting
  # ============================================
  code-quality:
    name: 🔍 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: 🔎 Flake8 Lint检查
        run: |
          echo "============================================"
          echo "🔍 运行Flake8代码风格检查"
          echo "============================================"
          flake8 common/ pipelines/ hardware/ scripts/ \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --max-line-length=120 \
            --exclude=__pycache__,.git,__pycache__,docs,old,build,dist
          echo "✅ Flake8检查完成"
      
      - name: ⬛ Black格式化检查
        run: |
          echo "============================================"
          echo "⬛ 检查代码格式化 (Black)"
          echo "============================================"
          black --check --line-length=120 \
            common/ pipelines/ hardware/ scripts/
          echo "✅ 格式检查完成"
        continue-on-error: true
      
      - name: 📐 Import排序检查 (isort)
        run: |
          echo "============================================"
          echo "📐 检查导入语句排序 (isort)"
          echo "============================================"
          isort --check-only --profile black \
            common/ pipelines/ hardware/ scripts/
          echo "✅ 导入排序检查完成"
        continue-on-error: true
      
      - name: 🔷 类型检查 (MyPy)
        run: |
          echo "============================================"
          echo "🔷 运行类型注解检查 (MyPy)"
          echo "============================================"
          mypy common/core/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes || true
          echo "✅ 类型检查完成"
        continue-on-error: true
      
      - name: 📊 自定义质量检查器
        run: |
          echo "============================================"
          echo "📊 运行Workshop专用质量检查器"
          echo "============================================"
          python scripts/code_quality_checker.py common/core > quality_report.txt || true
          cat quality_report.txt
          echo "✅ 质量检查完成"

  # ============================================
  # Job 2: Unit Tests & Integration Tests
  # ============================================
  testing:
    name: 🧪 测试套件运行
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: 🧪 单元测试
        run: |
          echo "============================================"
          echo "🧪 运行单元测试"
          echo "============================================"
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=common \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --junitxml=junit-unit.xml \
            -n auto
        env:
          REDIS_URL: redis://localhost:6379/0
      
      - name: 🔗 集成测试
        run: |
          echo "============================================"
          echo "🔗 运行集成测试"
          echo "============================================"
          python -m pytest tests/integration/ \
            -v \
            --tb=long \
            --junitxml=junit-integration.xml
        continue-on-error: true
      
      - name: 🏗️ 构建与部署脚本测试
        run: |
          echo "============================================"
          echo "🏗️ 测试部署工具"
          echo "============================================"
          python scripts/deploy_v2.py --check-env
          echo "✅ 部署工具测试通过"
        continue-on-error: true
      
      - name: 📈 性能基准测试
        run: |
          echo "============================================"
          echo "📈 运行性能基准测试"
          echo "============================================"
          python scripts/performance_benchmark_v1_vs_v2.py || true
          echo "✅ 性能测试完成"
        continue-on-error: true
      
      - name: 🛡️ 安全审计
        run: |
          echo "============================================"
          echo "🛡️ 运行安全审计扫描"
          echo "============================================"
          python -c "
          from common.core.security_audit import run_full_security_audit
          report = run_full_security_audit('.')
          print(f'发现 {len(report[\"findings\"])} 个安全问题')
          for finding in report['findings']:
              print(f'  [{finding.severity.value}] {finding.rule_id}: {finding.title}')
          " || true
          echo "✅ 安全审计完成"
      
      - name: 📊 上传测试覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            coverage-unit.xml
            junit-unit.xml
            junit-integration.xml
          retention-days: 30
      
      - name: 💾 上传覆盖率到Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.10'
        with:
          files: ./coverage-unit.xml
          flags: unittests
          name: workshop-v2-coverage
          fail_ci_if_error: false

  # ============================================
  # Job 3: Security Scanning
  # ============================================
  security-scan:
    name: 🛡️ 安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🔍 Trivy漏洞扫描 (文件系统)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: 🐍 Python依赖安全审计
        run: |
          pip install safety bandit
          
          echo "============================================"
          echo "🔒 Safety依赖漏洞检查"
          echo "============================================"
          safety check -r requirements.txt || true
          
          echo ""
          echo "============================================"
          echo "🔍 Bandit静态安全分析"
          echo "============================================"
          bandit -r common/ pipelines/ -ll || true
        continue-on-error: true
      
      - name: 📝 Secrets扫描
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          only-verified: true
        continue-on-error: true

  # ============================================
  # Job 4: Build Docker Image
  # ============================================
  build-docker:
    name: 🐳 构建Docker镜像
    runs-on: ubuntu-latest
    needs: [testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🏷️ 设置Docker元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/workshop-v2
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: 🔑 登录GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐳 设置QEMU (多架构构建)
        uses: docker/setup-qemu-action@v3
      
      - name: 🔨 设置Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ 构建并推送Docker镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ============================================
  # Job 5: Deploy to Staging
  # ============================================
  deploy-staging:
    name: 🚀 部署到Staging环境
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: staging
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🚀 部署到Staging
        run: |
          echo "============================================"
          echo "🚀 部署到 Staging 环境"
          echo "============================================"
          echo "镜像标签: ${{ needs.build-docker.outputs.image_tag }}"
          echo "部署时间: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          
          # 这里添加实际的部署命令，例如：
          # ssh deploy@staging-server "cd /opt/workshop && docker-compose pull && docker-compose up -d"
          
          echo "✅ Staging部署完成"
      
      - name: ✅ 健康检查
        run: |
          echo "执行健康检查..."
          sleep 30
          # curl -f http://staging.example.com/health || exit 1
          echo "✅ 健康检查通过"
      
      - name: 📧 通知部署结果
        if: always()
        run: |
          echo "发送部署通知..."

  # ============================================
  # Job 6: Deploy to Production (Manual)
  # ============================================
  deploy-production:
    name: 🏭 部署到生产环境
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🏭 生产环境预检
        run: |
          echo "============================================"
          echo "🔍 生产环境部署前检查"
          echo "============================================"
          
          echo "1. 确认镜像存在..."
          echo "   镜像: ${{ needs.build-docker.outputs.image_tag }}"
          
          echo "2. 备份当前版本..."
          # ssh prod@server "docker save current-image | gzip > backup_$(date +%Y%m%d_%H%M%S).tar.gz"
          
          echo "3. 检查数据库连接..."
          # 检查数据库可访问性
          
          echo "✅ 预检通过"
      
      - name: 🚀 蓝绿部署
        run: |
          echo "============================================"
          echo "🔄 执行蓝绿部署"
          echo "============================================"
          
          # 1. 启动新版本容器（绿色）
          # 2. 健康检查新版本
          # 3. 切换流量到新版本
          # 4. 监控错误率
          # 5. 如果正常，停止旧版本（蓝色）
          
          echo "✅ 生产部署完成"
      
      - name: 📊 部署后验证
        run: |
          echo "执行生产环境验证测试..."
          sleep 60
          
          # 运行冒烟测试
          # curl -f https://prod.example.com/api/health
          # 运行关键Pipeline测试
          
          echo "✅ 生产验证通过"
      
      - name: 📢 发布通知
        if: success()
        run: |
          echo "🎉 成功部署到生产环境！"
          # 发送Slack/钉钉/企业微信通知
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ Workshop V2.0 已成功部署到生产环境"}' \
          #   $WEBHOOK_URL
  
  # ============================================
  # Job 7: Scheduled Maintenance Tasks
  # ============================================
  scheduled-tasks:
    name: ⏰ 定时维护任务
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
      
      - name: 🐍 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt || true
      
      - name: 🗑️ 日志清理任务
        run: |
          echo "执行定期日志清理..."
          python scripts/ops_toolkit.py --cleanup-logs --days 14 --execute || true
      
      - name: 💾 自动备份
        run: |
          echo "创建自动备份..."
          python scripts/ops_toolkit.py --backup --type incremental || true
      
      - name: 🏥 系统健康检查
        run: |
          python scripts/ops_toolkit.py --health-check || true
      
      - name: 📊 生成日报
        run: |
          echo "生成运维日报..."
          python scripts/ops_toolkit.py --daily-maintenance || true
      
      - name: 📧 发送运维报告
        run: |
          echo "发送运维日报邮件..."
          # 使用GitHub Actions的邮件发送功能或调用API

  # ============================================
  # Job 8: Performance Regression Test
  # ============================================
  performance-test:
    name: ⚡ 性能回归测试
    runs-on: ubuntu-latest
    needs: testing
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 安装依赖
        run: |
          pip install -r requirements.txt || true
      
      - name: ⚡ 运行性能基准测试
        id: benchmark
        run: |
          echo "============================================"
          echo "⚡ 性能回归测试"
          echo "============================================"
          
          python scripts/performance_benchmark_v1_vs_v2.py > benchmark_result.json || true
          
          echo "## ⚡ 性能测试结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat benchmark_result.json >> $GITHUB_STEP_SUMMARY || true
          
          echo "✅ 性能测试完成"
        continue-on-error: true
      
      - name: 📊 性能对比注释
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            
            // 读取性能结果并添加PR评论
            try {
              const result = JSON.parse(fs.readFileSync('benchmark_result.json', 'utf8'));
              
              const comment = `## ⚡ 性能回归测试结果\n\n` +
                `**平均性能提升**: ${result.average_improvement_pct || 'N/A'}%\n\n` +
                `详细结果请查看上面的步骤输出。\n\n` +
                `*此评论由CI自动生成*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch(e) {
              console.log('无法解析性能测试结果:', e.message);
            }
