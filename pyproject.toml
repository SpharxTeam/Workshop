[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-workshop"
version = "3.0.0"
description = "企业级数据处理管道框架 V3.0 - 基于 AgentOS 和 Deepness 架构模式"
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "SPHARX DevTeam", email = "lidecheng@spharx.cn"}
]
maintainers = [
    {name = "SPHARX DevTeam", email = "wangliren@spharx.cn"}
]
keywords = [
    "data-processing",
    "pipeline",
    "computer-vision",
    "ros",
    "agentos",
    "deepness",
    "machine-learning",
    "data-factory"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.21.0",
    "opencv-python-headless>=4.5.0",
    "Pillow>=8.0.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.64.0",
    "prometheus-client>=0.16.0",
    "structlog>=22.1.0",
    "typing-extensions>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "ruff>=0.1.0",
]
hardware = [
    "pyrealsense2>=2.54.0",
]
ml = [
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "ultralytics>=8.0.0",
]
oss = [
    "oss2>=2.17.0",
]
all = [
    "core-workshop[dev]",
    "core-workshop[hardware]",
    "core-workshop[ml]",
    "core-workshop[oss]",
]

[project.urls]
Homepage = "https://atomgit.com/spharx/workshop"
Documentation = "https://atomgit.com/spharx/workshop/-/blob/master/README.md"
Repository = "https://atomgit.com/spharx/workshop.git"
Issues = "https://atomgit.com/spharx/workshop/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core_workshop*", "commons*", "common*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | partdata
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "numpy.*",
    "PIL.*",
    "yaml.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "hardware: marks tests as requiring hardware",
]

[tool.coverage.run]
source = ["core_workshop", "commons"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/partdata/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"test_*" = ["B011"]
