# 质量检测阈值配置

image_quality:
  # 模糊检测阈值
  blur:
    minimum_variance: 100.0
    warning_variance: 200.0
    optimal_variance: 500.0
  
  # 亮度检测阈值
  brightness:
    minimum: 30
    maximum: 220
    optimal_range: [80, 180]
  
  # 对比度检测阈值
  contrast:
    minimum: 0.1
    warning: 0.3
    optimal: 0.6

sync_quality:
  # 时间同步阈值 (毫秒)
  timestamp_tolerance:
    critical: 10.0
    warning: 5.0
    optimal: 1.0
  
  # 帧编号同步阈值
  frame_number_tolerance:
    critical: 3
    warning: 1
    optimal: 0

depth_quality:
  # 深度数据有效性阈值
  validity:
    min_distance_mm: 100
    max_distance_mm: 10000
    confidence_threshold: 0.8
  
  # 深度噪声阈值
  noise:
    maximum_std_dev: 50.0
    warning_std_dev: 25.0

annotation_quality:
  # 标注质量阈值
  bounding_boxes:
    minimum_size_pixels: 20
    maximum_aspect_ratio: 5.0
    confidence_threshold: 0.5
  
  # 标注一致性检查
  consistency:
    overlap_threshold: 0.8
    duplicate_distance_threshold: 10

overall_quality:
  # 总体质量评分阈值
  scores:
    critical: 0.3
    warning: 0.6
    acceptable: 0.8
    excellent: 0.95