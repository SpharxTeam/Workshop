# Spharx Workshop 流水线配置文件
# 所有模块的默认参数在此定义，可通过命令行参数覆盖

# 全局配置
global:
  data_root: /data
  log_dir: /logs

# 导入模块 (ingest)
ingest:
  # 无特殊参数，输入输出通过命令行传递

# 质检模块 (quality)
quality:
  blur_threshold: 100          # 模糊检测阈值（Laplacian方差）
  over_threshold: 240           # 过曝阈值（平均亮度）
  under_threshold: 30           # 欠曝阈值
  expected_fps: 30              # 期望帧率（用于丢帧检测）

# 增强模块 (enhance)
enhance:
  conf_threshold: 0.25          # YOLO 置信度阈值
  model_path: "yolov8n.pt"      # 模型文件名（运行时下载或挂载）

# 标定模块 (calibrate)
calibrate:
  chessboard: [9, 6]            # 棋盘格内角点数 (宽, 高)
  square_size: 0.025            # 方格尺寸（米）

# 打包模块 (pack)
pack:
  formats: ["ros", "coco"]      # 输出格式（目前仅用于标识）