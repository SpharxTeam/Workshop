# ============================================
# 特殊配置（覆盖默认设置）
# ============================================
x-spharx-defaults: &spharx-defaults
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      tag: "{{.Name}}"

# 应用默认配置到所有服务（除非单独指定）
