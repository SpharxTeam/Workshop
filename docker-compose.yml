# ============================================
# Workshop V2.0 Docker Compose Configuration
# Production-ready multi-service orchestration
# ============================================

version: '3.8'

services:
  # ============================================
  # Main Application Service
  # ============================================
  workshop-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spharx/workshop-v2:latest
    container_name: workshop-app
    restart: unless-stopped
    
    environment:
      - WORKSHOP_ENV=${WORKSHOP_ENV:-production}
      - WORKSHOP_LOG_LEVEL=${WORKSHOP_LOG_LEVEL:-INFO}
      - WORKSHOP_DATA_DIR=/app/data
      - WORKSHOP_LOG_DIR=/app/logs
      - WORKSHOP_BACKUP_DIR=/app/backups
      - WORKSHOP_TEMP_DIR=/app/temp
      # Database (if using in future)
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/workshop.db}
      # Redis (for caching/job queue)
      - REDIS_URL=redis://redis:6379/0
      # Monitoring
      - PROMETHEUS_PORT=9090
      - ENABLE_METRICS=true
    
    volumes:
      # Persistent data storage
      - workshop_data:/app/data
      - workshop_logs:/app/logs
      - workshop_backups:/app/backups
      # Hardware access (for cameras)
      - /dev/bus/usb:/dev/bus/usb:rw
      # Time synchronization
      - /etc/localtime:/etc/localtime:ro
    
    ports:
      # Application API (if needed in future)
      - "8000:8000"
      # Metrics endpoint for Prometheus
      - "9090:9090"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - workshop-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "from common.core.base_pipeline import BasePipeline; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    
    labels:
      - "com.spharx.service=workshop"
      - "com.spharx.version=2.0.0"

  # ============================================
  # Redis Cache & Message Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: workshop-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    networks:
      - workshop-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    deploy:
      resources:
        limits:
          memory: 768M

  # ============================================
  # Prometheus Monitoring
  # ============================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: workshop-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    
    ports:
      - "9091:9090"
    
    networks:
      - workshop-network
    
    depends_on:
      - workshop-app
    
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================
  # Grafana Dashboard
  # ============================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: workshop-grafana
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    
    ports:
      - "3000:3000"
    
    networks:
      - workshop-network
    
    depends_on:
      - prometheus
    
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================
  # Log Aggregation (Loki + Promtail)
  # Optional: Lightweight alternative to ELK stack
  # ============================================
  loki:
    image: grafana/loki:2.8.0
    container_name: workshop-loki
    restart: unless-stopped
    
    command: -config.file=/etc/loki/local-config.yaml
    
    volumes:
      - ./config/loki:/etc/loki
      - loki_data:/loki
    
    ports:
      - "3100:3100"
    
    networks:
      - workshop-network
    
    deploy:
      resources:
        limits:
          memory: 1G
  
  promtail:
    image: grafana/promtail:2.8.0
    container_name: workshop-promtail
    restart: unless-stopped
    
    volumes:
      - /var/log:/var/log:ro
      - ./config/promtail:/etc/promtail
      - workshop_logs:/app/logs:ro
    
    command: -config.file=/etc/promtail/config.yml
    
    networks:
      - workshop-network
    
    depends_on:
      - loki

# ============================================
# Shared Volumes
# ============================================
volumes:
  workshop_data:
    driver: local
    name: workshop_data
  
  workshop_logs:
    driver: local
    name: workshop_logs
  
  workshop_backups:
    driver: local
    name: workshop_backups
  
  redis_data:
    driver: local
    name: workshop_redis_data
  
  prometheus_data:
    driver: local
    name: workshop_prometheus_data
  
  grafana_data:
    driver: local
    name: workshop_grafana_data
  
  loki_data:
    driver: local
    name: workshop_loki_data

# ============================================
# Networks
# ============================================
networks:
  workshop-network:
    driver: bridge
    name: workshop_network
    ipam:
      config:
        - subnet: 172.28.0.0/16
