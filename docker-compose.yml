version: '3.8'

# ============================================
# SpharxWorkshop 核心服务编排
# 描述：定义所有Docker服务及其依赖关系
# ============================================

# 自定义网络，所有服务在同一个网络中便于通信
networks:
  spharx-network:
    driver: bridge
    ipam:
      config:
        - subnet: "172.20.0.0/16"  # 固定子网，避免重启变化

# 数据卷定义（命名卷，便于管理和备份）
volumes:
  # 主数据卷：存储所有输入输出数据
  spharx-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/SpharxWorkshop/data"  # 绑定到宿主机目录
  
  # 模型缓存卷：存储下载的AI模型
  model-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "/home/SpharxWorkshop/.cache/models"
  
  # 数据库卷：存储应用状态和元数据
  postgres-data:
    driver: local
  
  # Redis卷：缓存和消息队列
  redis-data:
    driver: local

# 服务定义
services:
  # ==================== 主控制服务 ====================
  spharx-controller:
    build: 
      context: .  # 使用当前目录下的Dockerfile
      dockerfile: Dockerfile
      args:
        - PYTHON_VERSION=3.11  # 构建参数，可在Dockerfile中使用
    container_name: ${PROJECT_NAME:-spharx}_controller
    hostname: controller
    restart: unless-stopped  # 自动重启策略
    
    # 端口映射（主机端口:容器端口）
    ports:
      - "8081:8080"  # 主API端口
      - "5678:5678"  # 调试端口（如使用debugpy）
    
    # 环境变量文件（从.env加载）
    env_file:
      - .env
    
    # 环境变量覆盖（如有需要）
    environment:
      - PYTHONUNBUFFERED=1  # 确保Python输出实时刷新
      - PYTHONPATH=/app     # Python模块搜索路径
      - TZ=Asia/Shanghai    # 时区设置
    
    # 数据卷挂载（宿主机目录:容器内目录）
    volumes:
      # 代码挂载（开发时实时同步）
      - .:/app:rw
      
      # 数据目录挂载
      - spharx-data:/home/SpharxWorkshop/data:rw
      
      # 模型缓存
      - model-cache:/root/.cache:rw
      
      # Docker套接字（允许控制其他容器，慎用）
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # 临时文件（可加快处理速度）
      - /tmp:/tmp:rw
    
    # 资源限制（根据服务器配置调整）
    deploy:
      resources:
        limits:
          cpus: '2.0'   # 最多使用2个CPU核心
          memory: 4G    # 最多使用4GB内存
        reservations:
          cpus: '0.5'
          memory: 1G
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 依赖关系（先启动这些服务）
    depends_on:
      # - redis  # 后续添加
      # - postgres  # 后续添加
    
    # 网络配置
    networks:
      spharx-network:
        ipv4_address: 172.20.0.10  # 固定IP，便于服务间调用
    
    # 启动命令（默认保持容器运行）
    command: tail -f /dev/null
    # 生产环境使用：command: python src/main.py
    
    # 标签（便于管理和监控）
    labels:
      - "com.spharx.service=controller"
      - "com.spharx.version=1.0"
      - "com.spharx.stage=${PROJECT_STAGE:-development}"

