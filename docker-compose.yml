version: '3.8'

networks:
  workshop-net:
    driver: bridge

volumes:
  processed_data:
  datasets_data:
  calibration_images_data:
  # raw_data 使用绑定挂载（便于手动放入bag文件），也可改为卷，这里保持绑定挂载方便

services:
  ingest:
    image: workshop-ingest:latest
    container_name: workshop-ingest
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      # 将宿主机 raw 目录挂载到容器内的 /data/raw（只读）
      - ./partdata/tests/raw:/data/raw:ro
      - processed_data:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["--input", "/data/raw/stairs.bag", "--output", "/data/processed/${SCENE_ID}"]

  quality:
    image: workshop-quality:latest
    container_name: workshop-quality
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - processed_data:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/processed/${SCENE_ID}/quality"]
    depends_on:
      - ingest

  enhance:
    image: workshop-enhance:latest
    container_name: workshop-enhance
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - processed_data:/data/processed
      - ./common/configs:/app/common/configs:ro
      - ./partdata/models:/data/models:ro   # 模型文件挂载到 /data/models
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - YOLO_MODEL_PATH=/data/models/yolov8n.pt   # 可通过环境变量传递
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/processed/${SCENE_ID}/enhanced"]
    depends_on:
      - quality

  calibrate:
    image: workshop-calibrate:latest
    container_name: workshop-calibrate
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - calibration_images_data:/data/calibration_images:ro
      - processed_data:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["--input", "/data/calibration_images", "--output", "/data/processed/${SCENE_ID}/calib"]
    depends_on:
      - enhance

  pack:
    image: workshop-pack:latest
    container_name: workshop-pack
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - processed_data:/data/processed
      - datasets_data:/data/datasets
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/datasets/${SCENE_ID}"]
    depends_on:
      - calibrate

  delivery:
    image: workshop-delivery:latest
    container_name: workshop-delivery
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - datasets_data:/data/datasets
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: ["--input", "/data/datasets/${SCENE_ID}"]
    depends_on:
      - pack
    profiles:
      - delivery