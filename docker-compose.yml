# =================================================================================
# workshop 完整数据采集流水线运行脚本（最终版）
# 功能：按顺序执行 ingest → quality → enhance → calibrate → pack
#       所有输出数据存储于 Docker 命名卷中，彻底解决权限问题
# 用法：./scripts/pipeline/run_full.sh [选项] <宿主机bag路径> [场景ID]
# 示例：./scripts/pipeline/run_full.sh /mnt/d/Spharx/SpharxWorks/workshop/partdata/tests/raw/stairs.bag scene_001
# =================================================================================
version: '3.8'

networks:
  workshop-net:
    driver: bridge

services:
  ingest:
    image: workshop-ingest:latest
    container_name: workshop-ingest
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/input/raw:/data/raw:ro
      - ./produce/output/processed:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
    command: ["--input", "/data/raw/${BAG_FILE}", "--output", "/data/processed/${SCENE_ID}"]

  quality:
    image: workshop-quality:latest
    container_name: workshop-quality
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/output/processed:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/processed/${SCENE_ID}/quality"]
    depends_on:
      - ingest

  enhance:
    image: workshop-enhance:latest
    container_name: workshop-enhance
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/output/processed:/data/processed
      - ./common/configs:/app/common/configs:ro
      - ./partdata/models:/data/models:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - YOLO_MODEL_PATH=/data/models/yolov8n.pt
      - TZ=Asia/Shanghai
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/processed/${SCENE_ID}/enhanced"]
    depends_on:
      - quality

  calibrate:
    image: workshop-calibrate:latest
    container_name: workshop-calibrate
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/input/calibration:/data/calibration_images:ro
      - ./produce/output/processed:/data/processed
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
    command: ["--input", "/data/calibration_images", "--output", "/data/processed/${SCENE_ID}/calib"]
    depends_on:
      - enhance

  pack:
    image: workshop-pack:latest
    container_name: workshop-pack
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/output/processed:/data/processed
      - ./produce/output/datasets:/data/datasets
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
    command: ["--input", "/data/processed/${SCENE_ID}", "--output", "/data/datasets/${SCENE_ID}"]
    depends_on:
      - calibrate

  delivery:
    image: workshop-delivery:latest
    container_name: workshop-delivery
    restart: unless-stopped
    networks:
      - workshop-net
    volumes:
      - ./produce/output/datasets:/data/datasets
      - ./common/configs:/app/common/configs:ro
    environment:
      - PYTHONPATH=/app/common/scripts
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
    command: ["--input", "/data/datasets/${SCENE_ID}"]
    depends_on:
      - pack
    profiles:
      - delivery