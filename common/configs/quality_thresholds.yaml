# Workshop 质量检测阈值配置文件
# 说明：供质检模块及其他需要质量参数的模块使用

# 图像质量检测
image_quality:
  # 模糊检测阈值（基于拉普拉斯方差）
  blur:
    minimum_variance: 100.0     # 最低可接受方差值
    warning_variance: 200.0     # 警告级别方差值
    optimal_variance: 500.0     # 理想方差值
    kernel_size: 3              # 拉普拉斯算子核大小
  
  # 亮度检测阈值
  brightness:
    minimum: 30                 # 最低亮度值 (0-255)
    maximum: 220                # 最高亮度值 (0-255)
    optimal_range: [80, 180]    # 理想亮度范围
    histogram_bins: 256         # 直方图分箱数
  
  # 对比度检测阈值
  contrast:
    minimum: 0.1                # 最低对比度
    warning: 0.3                # 警告级别对比度
    optimal: 0.6                # 理想对比度
    method: "rms"               # 计算方法: rms/michelson

# 同步质量检测
sync_quality:
  # 时间同步阈值 (毫秒)
  timestamp_tolerance:
    critical: 10.0              # 严重不同步阈值
    warning: 5.0                # 警告级别阈值
    optimal: 1.0                # 理想同步精度
    sampling_window_ms: 1000    # 采样窗口大小
  
  # 帧编号同步阈值
  frame_number_tolerance:
    critical: 3                 # 严重不同步帧数
    warning: 1                  # 警告级别帧数
    optimal: 0                  # 完美同步
    check_frequency: 30         # 检查频率(Hz)

# 深度数据质量
depth_quality:
  # 深度数据有效性阈值
  validity:
    min_distance_mm: 100        # 最小有效距离(mm)
    max_distance_mm: 10000      # 最大有效距离(mm)
    confidence_threshold: 0.8   # 置信度阈值
    invalid_value: 0            # 无效深度值标识
  
  # 深度噪声阈值
  noise:
    maximum_std_dev: 50.0       # 最大标准差(mm)
    warning_std_dev: 25.0       # 警告级别标准差(mm)
    spatial_window: 5           # 空间平滑窗口大小
    temporal_window: 3          # 时间平滑窗口大小

# 标注质量检测
annotation_quality:
  # 边界框质量阈值
  bounding_boxes:
    minimum_size_pixels: 20     # 最小边界框尺寸(像素)
    maximum_aspect_ratio: 5.0   # 最大宽高比
    confidence_threshold: 0.5   # 检测置信度阈值
    minimum_area_ratio: 0.001   # 最小面积占比
  
  # 标注一致性检查
  consistency:
    overlap_threshold: 0.8      # 重叠度阈值(IoU)
    duplicate_distance_threshold: 10  # 重复检测距离阈值(像素)
    class_consistency_required: true  # 是否要求类别一致性

# 总体质量评估
overall_quality:
  # 总体质量评分阈值
  scores:
    critical: 0.3               # 严重质量问题阈值
    warning: 0.6                # 警告级别阈值
    acceptable: 0.8             # 可接受质量阈值
    excellent: 0.95             # 优秀质量阈值
  
  # 权重配置
  weights:
    image_quality: 0.3          # 图像质量权重
    sync_quality: 0.2           # 同步质量权重
    depth_quality: 0.25         # 深度质量权重
    annotation_quality: 0.25    # 标注质量权重

# 报告和日志配置
reporting:
  generate_summary: true        # 生成摘要报告
  save_detailed_logs: true      # 保存详细日志
  format: "json"                # 报告格式(json/yaml/html)
  retention_days: 30            # 报告保留天数
  alert_threshold: "warning"    # 告警触发阈值(critical/warning)