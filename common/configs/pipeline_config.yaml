# ============================================================================
# Workshop 流水线全局配置
# 定义数据路径、模块使能、性能参数等
# ============================================================================

global:
  data_root: /partdata
  log_dir: /logs
  temp_dir: /tmp

# 各模块使能开关
modules:
  ingest:
    enabled: true
    method: "realsense"          # 数据导入方式
  
  quality:
    enabled: true
    tiers_enabled: ["hardware"]  # 启用的质检层级（预留）
  
  enhance:
    enabled: true
    detection_model: "yolov8"    # 检测模型类型
  
  calibrate:
    enabled: true
    calibration_type: "intrinsic" # 标定类型
  
  pack:
    enabled: true
    output_formats: ["ros", "coco"]   # 打包格式
  
  delivery:
    enabled: false                # 默认关闭交付模块
    protocols: ["oss", "sftp"]     # 支持的交付协议

# 数据流路径（相对于 global.data_root）
data_flow:
  input_source: "raw"              # 原始 bag 存放目录
  processing_root: "processed"     # 中间处理结果目录
  output_destination: "datasets"   # 最终数据集目录
  backup_enabled: false

# 性能配置
performance:
  parallel_processing: true
  max_workers: 4
  memory_limit_gb: 8
  gpu_enabled: false