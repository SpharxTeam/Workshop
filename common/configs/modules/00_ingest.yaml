# 00_ingest 模块配置
privacy:
  enable_blur: true
  blur_kernel_size: 15
  face_detection: true

data_format:
  output_structure: "standard"  # standard/custom
  compression_level: 6

input:
  bag_file_extensions: [".bag"]
  max_file_size_mb: 1024
  buffer_size: 100

output:
  create_manifest: true
  generate_timestamps: true