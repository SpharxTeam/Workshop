# 04_pack 模块配置文件

formats:
  ros:
    enabled: true
    compression: "bz2"
    chunk_size: 100
  coco:
    enabled: true
    split_ratios: [0.7, 0.2, 0.1]
    # train/val/test

metadata:
  include_sensor_info: true
  include_calibration: true
  generate_checksums: true

validation:
  verify_integrity: true
  check_annotations: true