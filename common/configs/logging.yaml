version: 1

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s:%(lineno)d: %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /logs/pipeline.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  hardware:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  pipelines:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  dashboard:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, file]