# ============================================
# Prometheus Configuration for Workshop V2.0
# Scrapes metrics from application and infrastructure
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'workshop-monitor'
    environment: 'production'

# Alerting rules
rule_files:
  - /etc/prometheus/alert_rules.yml

# Scrape configurations
scrape_configs:
  # ============================================
  # Workshop Application Metrics
  # ============================================
  - job_name: 'workshop-app'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['workshop-app:9090']
        labels:
          service: 'workshop'
          environment: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'workshop-app'

  # ============================================
  # Redis Metrics (via redis_exporter)
  # ============================================
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          environment: 'production'

  # ============================================
  # Node Exporter (System Metrics)
  # Uncomment if using node-exporter sidecar
  # ============================================
  # - job_name: 'node-exporter'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node'
  #         environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'
