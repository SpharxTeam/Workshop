# ============================================
# Prometheus Alert Rules for Workshop V2.0
# Production monitoring alerts
# ============================================

groups:
  # ============================================
  # Application Health Alerts
  # ============================================
  - name: workshop_application_health
    interval: 30s
    rules:
      # Application down
      - alert: WorkshopAppDown
        expr: up{job="workshop-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Workshop应用实例宕机"
          description: "实例 {{ $labels.instance }} 已停止响应超过1分钟"

      # High error rate
      - alert: WorkshopHighErrorRate
        expr: |
          rate(workshop_errors_total[5m]) / rate(workshop_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workshop错误率过高"
          description: "错误率超过5% (当前值: {{ $value | humanizePercentage }})"

      # Pipeline execution failures
      - alert: PipelineExecutionFailure
        expr: increase(workshop_pipeline_failures_total[10m]) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "管道执行频繁失败"
          description: "过去10分钟内管道执行失败 {{ $value }} 次"

  # ============================================
  # Performance Alerts
  # ============================================
  - name: workshop_performance
    interval: 60s
    rules:
      # Slow pipeline execution
      - alert: PipelineSlowExecution
        expr: |
          histogram_quantile(0.95, rate(workshop_pipeline_duration_seconds_bucket[5m])) > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "管道执行缓慢"
          description: "P95延迟超过120秒 (当前: {{ $value }}s)"

      # High memory usage
      - alert: WorkshopHighMemoryUsage
        expr: |
          (process_resident_memory_bytes{job="workshop-app"} / 1024 / 1024) > 6000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "Workshop进程内存使用超过6GB (当前: {{ $value }}MB)"

      # CPU usage high
      - alert: WorkshopHighCPUUsage
        expr: |
          rate(process_cpu_seconds_total{job="workshop-app"}[5m]) * 100 > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU使用率过高"
          description: "CPU使用率超过80% (当前: {{ $value }}%)"

  # ============================================
  # Data Processing Alerts
  # ============================================
  - name: workshop_data_processing
    interval: 300s
    rules:
      # Data ingestion stalled
      - alert: DataIngestionStalled
        expr: |
          time() - timestamp(workshop_ingestion_last_success_timestamp) > 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "数据摄入停滞"
          description: "超过1小时未成功摄入新数据"

      # Disk space running low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/app/data"} 
           / node_filesystem_size_bytes{mountpoint="/app/data"}) < 0.1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "数据磁盘空间不足"
          description: "/app/data 分区剩余空间不足10%"

      # Backup not recent
      - alert: BackupNotRecent
        expr: |
          time() - timestamp(workshop_backup_last_success_timestamp) > 172800
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: "备份未及时完成"
          description: "超过48小时未成功创建备份"

  # ============================================
  # Infrastructure Alerts
  # ============================================
  - name: workshop_infrastructure
    interval: 60s
    rules:
      # Redis connection issues
      - alert: RedisConnectionFailure
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis服务不可用"
          description: "Redis实例无法连接，可能影响缓存和任务队列"

      # Redis memory usage high
      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis内存使用率高"
          description: "Redis内存使用超过80%"
