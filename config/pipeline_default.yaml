# Spharx 数据生产线默认配置
version: "1.0"

# 输入输出设置
io:
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  default_image_size: 1920  # 长边缩放尺寸
  
# 2D标注阶段配置
2d_annotation:
  enabled: true
  sam_model: "vit_h"  # vit_b, vit_l, vit_h
  sam_score_threshold: 0.7
  auto_approve_threshold: 0.85  # 高于此分数自动通过
  
  # 输出格式
  export_formats:
    - coco
    - yolo
    - pascal_voc
    
  quality_control:
    min_annotation_area: 100  # 像素
    require_boundary_check: true

# 3D重建阶段配置
3d_reconstruction:
  enabled: false  # 初始关闭
  colmap:
    quality: "high"  # low, medium, high, extreme
    use_gpu: true
    max_image_size: 2000
    
  # 不同场景的预设参数
  presets:
    indoor:
      matcher_method: "exhaustive"
      ba_refine_focal_length: true
    outdoor:
      matcher_method: "sequential"
      ba_refine_focal_length: false

# 2D到3D标签提升配置
2d_to_3d_lift:
  enabled: false
  method: "sa3d"  # sa3d, simple_projection
  sa3d:
    iterations: 1000
    learning_rate: 0.01

# 物理事实生成配置
physics_generation:
  enabled: false
  blender:
    simulation_steps: 100
    gravity: 9.81
    default_material:
      friction: 0.5
      restitution: 0.3