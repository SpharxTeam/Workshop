version: '3.8'
services:
  # CVAT标注平台 (提供UI和API)
  cvat:
    image: cvat/server:latest
    container_name: ${PROJECT_PREFIX}_cvat
    ports:
      - "8080:8080"
    environment:
      CVAT_HOST: ${CVAT_HOST}
    volumes:
      - cvat_data:/home/django/data
      - cvat_keys:/home/django/keys
      - cvat_logs:/home/django/logs
    networks:
      - ${DOCKER_NETWORK}

  # SAM自动标注模型服务 (辅助CVAT)
  sam_auto_labeler:
    build:
      context: ./docker
      dockerfile: sam.Dockerfile
    container_name: ${PROJECT_PREFIX}_sam
    # 通过CVAT的webhook或API调用
    networks:
      - ${DOCKER_NETWORK}

  # 生产线主控制器
  workshop_controller:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    container_name: ${PROJECT_PREFIX}_controller
    volumes:
      # 挂载数据卷和代码
      - ${INPUT_SCENES_DIR}:${INPUT_SCENES_DIR}:ro
      - ${OUTPUT_DATASETS_DIR}:${OUTPUT_DATASETS_DIR}
      - ${WORKSPACE_DIR}:${WORKSPACE_DIR}
      - ./src:/app/src  # 开发时源码热加载
    environment:
      - ENV_FILE=/app/.env
    depends_on:
      - cvat
    command: ["python", "-m", "src.main", "--mode", "2d-only"]
    networks:
      - ${DOCKER_NETWORK}

networks:
  default:
    name: ${DOCKER_NETWORK}
    external: true  # 需先创建

volumes:
  cvat_data:
  cvat_keys:
  cvat_logs: